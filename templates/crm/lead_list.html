{% extends 'base/base.html' %}
{% load rbac_tags %}

{% block content %}
<div class="space-y-6">

    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center space-x-3">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">CRM Leads & Pipeline</h1>
                <span class="rounded-full bg-indigo-50 border border-indigo-200 px-3 py-0.5 text-xs font-semibold text-indigo-700">
                    {{ total_count }} total
                </span>
            </div>
            <p class="text-xs text-slate-500 mt-1">
                Manage, capture, and track opportunities within <span class="font-medium text-slate-700">{{ request.tenant.name }}</span>.
            </p>
        </div>

        {% if request.user|can_edit %}
        <div>
            <button hx-get="{% url 'crm:lead_create' %}" 
                    hx-target="#modal-container" 
                    class="inline-flex items-center rounded-xl bg-indigo-600 px-4 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <svg class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Add New Lead
            </button>
        </div>
        {% endif %}
    </div>

    <!-- Filters & Search Bar -->
    <div class="flex flex-col sm:flex-row gap-3">
        <!-- Live Search Input -->
        <div class="relative flex-1">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="search" 
                   name="q" 
                   placeholder="Search leads by name, email, or company..." 
                   value="{{ query }}"
                   hx-get="{% url 'crm:lead_list' %}"
                   hx-trigger="keyup changed delay:350ms, search"
                   hx-target="#lead-table-container"
                   hx-include="[name='status']"
                   class="w-full rounded-xl border border-slate-300 bg-white pl-10 pr-4 py-2 text-sm text-slate-800 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
        </div>

        <!-- Status Filter Dropdown -->
        <div class="sm:w-48">
            <select name="status" 
                    hx-get="{% url 'crm:lead_list' %}"
                    hx-trigger="change"
                    hx-target="#lead-table-container"
                    hx-include="[name='q']"
                    class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                <option value="">All Pipeline Stages</option>
                {% for val, text in status_choices %}
                    <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ text }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- HTMX Reactive Table Container -->
    <div id="lead-table-container"
         hx-get="{% url 'crm:lead_list' %}"
         hx-trigger="refreshLeads from:body"
         hx-target="this">
        {% include 'crm/partials/lead_table.html' %}
    </div>

</div>
{% endblock %}
