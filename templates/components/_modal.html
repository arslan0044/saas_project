<!-- Component: _modal.html (React-style dynamic modal dialog wrapper) -->
<div id="modal-backdrop" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop Blur -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" 
         onclick="document.getElementById('modal-container').innerHTML = '';"></div>

    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 w-full {{ modal_width|default:'sm:max-w-xl' }} border border-slate-100">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-slate-100 bg-slate-50/70 px-6 py-4">
                <div>
                    <h3 class="text-base font-semibold leading-6 text-slate-900" id="modal-title">
                        {{ modal_title|default:"Form Dialog" }}
                    </h3>
                    {% if modal_subtitle %}
                    <p class="text-xs text-slate-500 mt-0.5">{{ modal_subtitle }}</p>
                    {% endif %}
                </div>
                <button type="button" 
                        onclick="document.getElementById('modal-container').innerHTML = '';" 
                        class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition focus:outline-none">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Modal Content / Body -->
            <div class="px-6 py-5">
                {{ modal_content }}
            </div>

        </div>
    </div>
</div>
