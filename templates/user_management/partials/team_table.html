<!-- Partial: team_table.html -->
<div class="overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm">
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-left text-sm text-slate-600">
            <thead class="bg-slate-50/80 text-xs uppercase tracking-wider font-semibold text-slate-500">
                <tr>
                    <th scope="col" class="px-6 py-3.5">User / Contact</th>
                    <th scope="col" class="px-6 py-3.5">Assigned Role</th>
                    <th scope="col" class="px-6 py-3.5">Phone</th>
                    <th scope="col" class="px-6 py-3.5">Joined</th>
                    <th scope="col" class="px-6 py-3.5 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="team-table-body" class="divide-y divide-slate-100 bg-white">
                {% for member in members %}
                    {% include 'user_management/partials/team_row.html' %}
                {% empty %}
                <tr>
                    <td colspan="5" class="px-6 py-16 text-center">
                        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-400">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </div>
                        <h3 class="mt-3 text-sm font-semibold text-slate-900">No team profiles found</h3>
                        <p class="mt-1 text-xs text-slate-500">Create user profiles in the tenant admin to see them here.</p>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
